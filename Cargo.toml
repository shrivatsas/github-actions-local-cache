[package]
name = "github-actions-local-cache"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Secure local filesystem cache actions for self-hosted GitHub Actions runners"
repository = "https://github.com/shrivatsas/github-actions-local-cache"

[[bin]]
name = "local-cache"
path = "src/main.rs"

[dependencies]
filetime = "0.2"
globset = "0.4"
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zstd = "0.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
